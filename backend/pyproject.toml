[project]
name = "abhijatri-backend"
version = "0.1.0"
description = "Abhijatri review vertical slice"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.120,<7",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a real PostgreSQL database",
]

[tool.coverage.run]
source = ["app"]
branch = true

